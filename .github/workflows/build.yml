name: Build & Test

on:
  schedule:
    # Run every Tuesday and Thursday at 6:00 AM UTC
    - cron: '0 6 * * 2,4'
  pull_request:
    branches:
      - develop
      - "feat*"
  merge_group:
    types: [checks_requested]
    branches:
      - develop
      - "feat*"

jobs:
  run-workflow:
    name: Parent PR Status Check
    # If any dependent jobs fails, this WF skips which won't block merging PRs
    # calling always() is required for this WF to run all the time
    if: github.repository_owner == 'aws' && always()
    runs-on: ubuntu-latest
    needs:
      - build-multi-arch
    steps:
      - name: report-failure
        if: |
          needs.build-multi-arch.result != 'success'
        run: exit 1
      - name: report-success
        run: exit 0

  get-sam-cli-version:
    runs-on: ubuntu-latest
    outputs:
      sam_cli_version: ${{ steps.sam_cli_version.outputs.sam_cli_version }}
    steps:
      - id: sam_cli_version
        run: echo "sam_cli_version=$(curl -s https://pypi.org/pypi/aws-sam-cli/json | jq -r .info.version)" >> $GITHUB_OUTPUT

  supported-runtimes:
    runs-on: ubuntu-latest
    outputs:
      runtimes: ${{ steps.list.outputs.runtimes }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'schedule' && 'develop' || github.ref }}
      - name: Check every Dockerfile has an entry in lambda_runtimes.json and vice versa
        run: python3 build-image-src/deprecated_runtimes.py validate
      - id: list
        run: |
          runtimes=$(python3 build-image-src/deprecated_runtimes.py supported)
          echo "runtimes=$runtimes" >> "$GITHUB_OUTPUT"
          echo "Building: $runtimes"

  build-multi-arch:
    strategy:
      fail-fast: false
      matrix:
        # Every Dockerfile-* except runtimes past their deprecation date in
        # build-image-src/deprecated_runtimes.py (see the supported-runtimes job).
        runtime: ${{ fromJSON(needs.supported-runtimes.outputs.runtimes) }}
        include:
          - skip_arm_test: false
    runs-on: ubuntu-latest
    needs: [get-sam-cli-version, supported-runtimes]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'schedule' && 'develop' || github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: aws-actions/setup-sam@v3
        with:
          use-installer: true
      - run: make init
      - run: SAM_CLI_VERSION=${{needs.get-sam-cli-version.outputs.sam_cli_version}} RUNTIME=${{matrix.runtime}} make build-multi-arch
      - run: SAM_CLI_VERSION=${{needs.get-sam-cli-version.outputs.sam_cli_version}} RUNTIME=${{matrix.runtime}} ARCH=x86_64 make test
      - run: SAM_CLI_VERSION=${{needs.get-sam-cli-version.outputs.sam_cli_version}} RUNTIME=${{matrix.runtime}} ARCH=arm64 make test
        if: ${{ ! matrix.skip_arm_test }}
