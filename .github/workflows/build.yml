name: Build & Test

on:
  schedule:
    # Run every Tuesday and Thursday at 6:00 AM UTC
    - cron: '0 6 * * 2,4'
  pull_request:
    branches:
      - develop
      - "feat*"
  merge_group:
    types: [checks_requested]
    branches:
      - develop
      - "feat*"

jobs:
  run-workflow:
    name: Parent PR Status Check
    # If any dependent jobs fails, this WF skips which won't block merging PRs
    # calling always() is required for this WF to run all the time
    if: github.repository_owner == 'aws' && always()
    runs-on: ubuntu-latest
    needs:
      - build-multi-arch
    steps:
      - name: report-failure
        if: |
          needs.build-multi-arch.result != 'success'
        run: exit 1
      - name: report-success
        run: exit 0

  get-sam-cli-version:
    runs-on: ubuntu-latest
    outputs:
      sam_cli_version: ${{ steps.sam_cli_version.outputs.sam_cli_version }}
    steps:
      - id: sam_cli_version
        run: echo "sam_cli_version=$(curl -s https://pypi.org/pypi/aws-sam-cli/json | jq -r .info.version)" >> $GITHUB_OUTPUT

  build-multi-arch:
    strategy:
      fail-fast: false
      matrix:
        runtime: 
          - "dotnet6"
          - "dotnet8"
          - "dotnet9"
          - "dotnet10"
          - "java8_al2"
          - "java8_al2023"
          - "java11"
          - "java11_al2023"
          - "java17"
          - "java17_al2023"
          - "java21"
          - "java25"
          - "nodejs16x"
          - "nodejs18x"
          - "nodejs20x"
          - "nodejs22x"
          - "nodejs24x"
          - "nodejs26x"
          - "provided_al2"
          - "provided_al2023"
          - "python38"
          - "python39"
          - "python310"
          - "python311"
          - "python312"
          - "python313"
          - "python314"
          - "python315"
          - "ruby32"
          - "ruby33"
          - "ruby34"
          - "ruby40"
        include:
          - skip_arm_test: false
          - runtime: "dotnet8"
            skip_arm_test: true
    runs-on: ubuntu-latest
    needs: [get-sam-cli-version]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'schedule' && 'develop' || github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: aws-actions/setup-sam@v3
        with:
          use-installer: true
      - run: make init
      - run: SAM_CLI_VERSION=${{needs.get-sam-cli-version.outputs.sam_cli_version}} RUNTIME=${{matrix.runtime}} make build-multi-arch
      - run: SAM_CLI_VERSION=${{needs.get-sam-cli-version.outputs.sam_cli_version}} RUNTIME=${{matrix.runtime}} ARCH=x86_64 make test
      - run: SAM_CLI_VERSION=${{needs.get-sam-cli-version.outputs.sam_cli_version}} RUNTIME=${{matrix.runtime}} ARCH=arm64 make test
        if: ${{ ! matrix.skip_arm_test }}
      # SBOMs for the Amazon Inspector PR scan. This job has no AWS credentials;
      # inspector-pr-scan.yml (workflow_run, trusted) downloads the artifact and
      # sends only the SBOMs to Inspector, so PR code never runs next to the role.
      - name: Generate SBOMs for the Inspector scan
        if: github.event_name == 'pull_request'
        run: |
          RUNTIME=${{matrix.runtime}} ARCH=x86_64 make sbom
          RUNTIME=${{matrix.runtime}} ARCH=arm64 make sbom
      - name: Record PR metadata for the Inspector scan
        if: github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          printf '{"pr": %d, "head_sha": "%s"}\n' "$PR_NUMBER" "$HEAD_SHA" > sbom/pr.json
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'pull_request'
        with:
          name: sbom-${{ matrix.runtime }}
          path: sbom/
          retention-days: 7
          if-no-files-found: error
